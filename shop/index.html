<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shop | Cupcake City</title>
  <link rel="stylesheet" href="../css/styles.css">
  
</head>
<body>
  <header class="nav">
    <div class="container nav-inner">
      <a class="brand" href="/">
        <span class="brand-badge">🧁</span>
        <span>Cupcake City</span>
      </a>

      <nav class="nav-links" aria-label="primary">
        <a href="/">Home</a>
        <a href="/shop/">Shop</a>
        <a href="/about/">About</a>
        <a href="/contact/">Contact</a>
        <a class="cart-pill" href="/cart/">
          Cart <span class="cart-count" data-cart-count>0</span>
        </a>
      </nav>

      <button class="mobile-toggle" id="mobileToggle" type="button">Menu</button>
    </div>
    <div class="container mobile-menu" id="mobileMenu" aria-label="mobile">
      <a href="/">Home</a>
      <a href="/shop/">Shop</a>
      <a href="/about/">About</a>
      <a href="/contact/">Contact</a>
      <a href="/cart/">Cart (<span data-cart-count>0</span>)</a>
    </div>
  </header>

  
<main class="container">
  <section class="section">
    <div class="section-title">
      <h2>Shop cupcakes</h2>
      <div class="hint">Search, filter, sort · add to cart</div>
    </div>

    <div class="toolbar" role="region" aria-label="shop filters">
      <input id="searchInput" class="input" placeholder="Search cupcakes (e.g., chocolate, mini, lemon)..." />
      <select id="categorySelect" class="select" aria-label="category">
        <option>All</option>
        <option>Cupcakes</option>
        <option>Kids</option>
        <option>Mini</option>
        <option>Special</option>
      </select>
      <select id="sortSelect" class="select" aria-label="sort">
        <option value="featured">Sort: Featured</option>
        <option value="price_asc">Price: Low → High</option>
        <option value="price_desc">Price: High → Low</option>
        <option value="name_asc">Name: A → Z</option>
      </select>
    </div>

    <div id="shopGrid" class="grid" aria-live="polite"></div>
  </section>
</main>


  <footer class="footer">
    <div class="container">
      <div style="display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap;">
        <div>© 2026 Cupcake City · Nairobi</div>
        <div class="muted">Fresh bakes · Custom orders · Events</div>
      </div>
    </div>
  </footer>

  <script src="../js/main.js"></script>
</body>
</html>
