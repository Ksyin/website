<!DOCTYPE html>
<html>
<head>
  <title>Shop Cupcakes</title>
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>

<header class="navbar">
  <h1 class="logo">🧁 Cupcake City</h1>
  <nav>
    <a href="/">Home</a>
    <a href="/cart/">Cart 🛒</a>
  </nav>
</header>

<h2 class="page-title">Cupcakes</h2>

<div class="product-grid">

    <img src="https://images.unsplash.com/photo-1599785209707-28d08b7d35a3">
    <h4>Chocolate Cupcakes (4 Pack)</h4>
    <p>KES 720</p>
    <button onclick="addToCart('Chocolate Cupcakes',720)">Add to Cart</button>
  </div>

  <div class="product-card">
    <img src="https://images.unsplash.com/photo-1589307004391-70fcdcf8a3c7">
    <h4>Vanilla Velvet (6 Pack)</h4>
    <p>KES 1,050</p>
    <button onclick="addToCart('Vanilla Velvet',1050)">Add to Cart</button>
  </div>
</div>

<script src="../js/main.js"></script>
</body>
</html>
